name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The test site: it builds, and nothing changed that can shift the load-test
  # results. The load tests themselves stay manual, as shared CI machines vary
  # too much for their timings to mean anything.
  test-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run guard

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
